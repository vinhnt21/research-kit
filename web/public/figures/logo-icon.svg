<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="rkBgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0"/>
    </radialGradient>

    <!-- Main dynamic gradient: Blue -> Cyan -> Emerald -->
    <linearGradient id="rkGradPrimary" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Reverse gradient for complementary orbital ring -->
    <linearGradient id="rkGradAlt" x1="90%" y1="10%" x2="10%" y2="90%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Core nucleus gradient -->
    <radialGradient id="rkCoreGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#06B6D4"/>
      <stop offset="90%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Filter glow -->
    <filter id="rkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Light -->
  <circle cx="100" cy="100" r="92" fill="url(#rkBgGlow)"/>

  <!-- Orbital Ring 1 (-32 deg) -->
  <ellipse cx="100" cy="100" rx="76" ry="28" transform="rotate(-32 100 100)"
    stroke="url(#rkGradPrimary)" stroke-width="4.5" stroke-linecap="round" filter="url(#rkGlow)"/>

  <!-- Orbital Ring 2 (32 deg) -->
  <ellipse cx="100" cy="100" rx="76" ry="28" transform="rotate(32 100 100)"
    stroke="url(#rkGradAlt)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Scientific Empirical Reticle (Outer Calibrated Ring) -->
  <circle cx="100" cy="100" r="42" stroke="url(#rkGradPrimary)" stroke-width="3" stroke-dasharray="6 3.5" opacity="0.85"/>
  <circle cx="100" cy="100" r="32" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>

  <!-- Precision Crosshairs / Calibrated Ticks (Empirical Rigor) -->
  <line x1="100" y1="50" x2="100" y2="62" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="100" y1="138" x2="100" y2="150" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="100" x2="62" y2="100" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="138" y1="100" x2="150" y2="100" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- AI Agent Nodes on Orbits (The 4 supported agent environments) -->
  <!-- Node 1: Cursor / Top Right -->
  <circle cx="152" cy="67" r="4" fill="#67E8F9" filter="url(#rkGlow)"/>
  <!-- Node 2: Claude Code / Bottom Right -->
  <circle cx="152" cy="133" r="4" fill="#34D399" filter="url(#rkGlow)"/>
  <!-- Node 3: Codex / Bottom Left -->
  <circle cx="48" cy="133" r="3.5" fill="#818CF8"/>
  <!-- Node 4: Antigravity / Top Left -->
  <circle cx="48" cy="67" r="3.5" fill="#38BDF8"/>

  <!-- Central Scientific Core (Empirical Nucleus) -->
  <circle cx="100" cy="100" r="16" fill="url(#rkCoreGrad)" filter="url(#rkGlow)"/>
  <!-- Core Inner Star/Diamond Specular -->
  <circle cx="100" cy="100" r="6" fill="#FFFFFF"/>
</svg>
