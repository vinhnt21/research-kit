<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="rkLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="rkLogoGradAlt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <radialGradient id="rkCoreGradL" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <filter id="rkGlowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group Icon (Centered around 64, 60, scale 0.52) -->
  <g transform="translate(64, 60) scale(0.52)">
    <!-- Orbital Ring 1 -->
    <ellipse cx="0" cy="0" rx="76" ry="28" transform="rotate(-32)"
      stroke="url(#rkLogoGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#rkGlowL)"/>
    <!-- Orbital Ring 2 -->
    <ellipse cx="0" cy="0" rx="76" ry="28" transform="rotate(32)"
      stroke="url(#rkLogoGradAlt)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Calibrated Reticle -->
    <circle cx="0" cy="0" r="42" stroke="url(#rkLogoGrad)" stroke-width="3" stroke-dasharray="6 3.5" opacity="0.85"/>
    <circle cx="0" cy="0" r="32" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>

    <!-- Crosshairs -->
    <line x1="0" y1="-50" x2="0" y2="-38" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="38" x2="0" y2="50" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="-38" y2="0" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="38" y1="0" x2="50" y2="0" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Agent Nodes -->
    <circle cx="52" cy="-33" r="4" fill="#67E8F9" filter="url(#rkGlowL)"/>
    <circle cx="52" cy="33" r="4" fill="#34D399" filter="url(#rkGlowL)"/>
    <circle cx="-52" cy="33" r="3.5" fill="#818CF8"/>
    <circle cx="-52" cy="-33" r="3.5" fill="#38BDF8"/>

    <!-- Empirical Core -->
    <circle cx="0" cy="0" r="16" fill="url(#rkCoreGradL)" filter="url(#rkGlowL)"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(132, 0)">
    <!-- Main Title -->
    <text x="0" y="62" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">Research </tspan>
      <tspan fill="url(#rkLogoGrad)">Kit</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="88" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, monospace" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.8">
      LEAN &amp; REPRODUCIBLE RESEARCH SKILLS FOR AI AGENTS
    </text>

    <!-- Version badge -->
    <rect x="250" y="36" width="56" height="20" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="278" y="50" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">v1.0</text>
  </g>
</svg>
